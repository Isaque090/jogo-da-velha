<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body>

    <div class="placar">

                </div>
            </div>
        </div>


    </div>
    <div class="card shadow-lg">

            <div class="botao" onclick="escolhe(1)">
